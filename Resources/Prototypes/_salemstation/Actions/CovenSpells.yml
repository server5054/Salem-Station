- type: entity
  id: ActionAntagMindSwap
  parent: BaseAction
  components:
  - type: EntityTargetAction
    name: Mind Swap
    description: Swap consciousness with a living target in your sight temporarily. Your original body is vulnerable.
    icon: /Textures/Interface/Actions/eyeopen.png # Replace with actual path
    useDelay: 15
    event: !type:AntagMindSwapActionEvent
    checkCanInteract: false
    range: 4
    

- type: entity #worldAction
  id: ActionHexPlayer
  parent: BaseAction
  name: Apply Hex
  description: Marks a single targeted player with a Hex.
  components:
  - type: Action
  - type: Sprite
    sprite: /Textures/Interface/Actions/eyeopen.png
    state: bleed
  - type: InstantAction
    event: !type:CovenHexPlayerActionEvent
    checkCanInteract: false
  
- type: entity
  id: ActionTriggerHex
  parent: BaseAction
  name: Ignite Hexes
  description: After a 5-minute delay, ignites and severely damages all marked players.
  components:
  - type: Action
  - type: Sprite
    sprite: /Textures/Interface/Actions/eyeopen.png
    state: fire
  - type: InstantAction
    event: !type:CovenTriggerHexActionEvent
    checkCanInteract: false