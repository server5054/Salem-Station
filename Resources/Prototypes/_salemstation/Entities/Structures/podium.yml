- type: entity
  id: TribunalPodium
  parent: BaseStructure
  name: tribunal execution podium
  description: A daunting podium where the station decides the fate of the accused.
  components:
  - type: Sprite
    sprite: Structures/Furniture/Tables/generic.rsi # Replace with your custom sprite
    state: full
  - type: Strap
    position: Down # Keeps them locked in place
  - type: TribunalPodium
  - type: InteractionOutline
  - type: ActivatableUI
    key: enum.Content.Shared._salemstation.TribunalUiKey.Key
  - type: UserInterface
    interfaces:
      enum.Content.Shared._salemstation.TribunalUiKey.Key:
        type: TribunalBoundUserInterface
  - type: Construction
    graph: Machine
    node: machine
  - type: WiresPanel
  - type: Machine
    board: TribunalPodiumMachineBoard
